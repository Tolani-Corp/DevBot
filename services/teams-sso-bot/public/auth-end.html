<html>
  <head>
    <title>Login End Page</title>
    <meta charset="utf-8" />
  </head>
  <body>
    <script
      src="https://res.cdn.office.net/teams-js/2.22.0/js/MicrosoftTeams.min.js"
      integrity="sha384-WSG/sWulIv7rel5TnFlH8JTpxl2OxzZh9Lux2mIzBFiTRLFvMBeFv9VURu/3vQdx"
      crossorigin="anonymous"
    ></script>
    <div id="divError"></div>
    <script type="text/javascript">
      microsoftTeams.app.initialize().then(function () {
        const hashParams = getHashParameters();

        if (hashParams.error) {
          handleAuthError(hashParams.error, hashParams);
        } else if (hashParams.code) {
          const expectedState = localStorage.getItem("state");
          if (expectedState !== hashParams.state) {
            handleAuthError("StateDoesNotMatch", hashParams);
          } else {
            microsoftTeams.authentication.notifySuccess();
          }
        } else {
          handleAuthError("UnexpectedFailure", hashParams);
        }
      });

      function getHashParameters() {
        const hashParams = {};
        location.hash
          .substr(1)
          .split("&")
          .forEach(function (item) {
            const pair = item.split("=");
            hashParams[pair[0]] = pair[1] && decodeURIComponent(pair[1]);
          });
        return hashParams;
      }

      function handleAuthError(errorType, errorMessage) {
        const error = JSON.stringify({
          error: errorType,
          message: JSON.stringify(errorMessage),
        });
        const para = document.createElement("p");
        para.appendChild(document.createTextNode(error));
        document.getElementById("divError").appendChild(para);
      }
    </script>
  </body>
</html>
