name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Activate repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          test "$(pnpm --version)" = "9.15.9"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check --pretty false
      - run: pnpm run commercial:check
      - run: pnpm run governance:evidence
      - run: pnpm run governance:policy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Activate repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          test "$(pnpm --version)" = "9.15.9"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Activate repository pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          test "$(pnpm --version)" = "9.15.9"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
