name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run governance:evidence
      - run: pnpm run governance:policy
      - run: |
          mkdir -p .devbot/deployments
          cat > ".devbot/deployments/${{ github.run_id }}.json" <<'JSON'
          {
            "schemaVersion": "devbot.deployment-intent.v1",
            "environment": "${{ github.event.inputs.environment }}",
            "runId": "${{ github.run_id }}",
            "sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "governanceEvidence": ".devbot/evidence/demo-delivery-evidence.json",
            "status": "ready-for-target-adapter"
          }
          JSON
      - name: Upload deployment intent
        uses: actions/upload-artifact@v4
        with:
          name: devbot-deployment-intent
          path: .devbot/deployments/${{ github.run_id }}.json
          if-no-files-found: error
