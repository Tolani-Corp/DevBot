name: THAS Acceptance Ledger CI

on:
  pull_request:
    paths:
      - "governance/thas/**"
      - "scripts/validate-thas-acceptance-ledger.py"
      - ".github/workflows/thas-acceptance-ledger-ci.yml"
  push:
    branches:
      - main
    paths:
      - "governance/thas/**"
      - "scripts/validate-thas-acceptance-ledger.py"
      - ".github/workflows/thas-acceptance-ledger-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate immutable THAS authority ledger
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned validator
        run: python -m pip install --disable-pip-version-check "jsonschema==4.25.1"

      - name: Validate THAS acceptance ledger
        run: |
          python scripts/validate-thas-acceptance-ledger.py \
            --schema governance/thas/acceptance-ledger-v1.schema.json \
            --ledger governance/thas/acceptance-ledger-v1.json

      - name: Reject mutable action references in the THAS governance plane
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'Tolani-Corp/DevBot/.github/actions/thas@(main|master|v[0-9]+([.][0-9]+)*)' governance/thas; then
            echo "Mutable THAS action reference detected." >&2
            exit 1
          fi
