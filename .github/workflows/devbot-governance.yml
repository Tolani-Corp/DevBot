name: DevBot Governance Evidence

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run check --pretty false
      - run: pnpm run commercial:check
      - run: pnpm run governance:evidence
      - run: pnpm run governance:check
      - run: pnpm run governance:policy
      - run: pnpm run natt:offline:vendor
      - run: pnpm run natt:offline:check
      - run: pnpm run natt:mirror:sbom
      - run: pnpm run natt:mirror:check

      - name: Upload governance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devbot-governance-evidence
          path: .devbot/evidence/demo-delivery-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload offline mirror evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: devbot-offline-mirror-evidence
          path: |
            vendor/natt-offline/manifest.json
            vendor/natt-external-mirrors/sbom.json
            vendor/natt-external-mirrors/checksums.sha256
          if-no-files-found: error
          retention-days: 14
