name: THAS v1.1 Organization Action CI

on:
  pull_request:
    paths:
      - ".github/actions/thas/**"
      - ".github/workflows/thas-v1-1-action-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate shared action offline
        uses: ./.github/actions/thas
        with:
          manifest: .github/actions/thas/offline-fixture.json
          offline: "true"
